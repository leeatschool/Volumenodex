name: Build and Release Cross-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-docx pyspellchecker pyinstaller Pillow pillow-jxl-plugin

      - name: Build with PyInstaller
        run: |
          pyinstaller Volumenodex.spec

      - name: Package Linux Distribution
        run: |
          TAG="${GITHUB_REF_NAME:-v2.1.0}"
          cp assets/icon.png dist/Volumenodex/
          cp volumenodex.desktop dist/Volumenodex/
          cp run_volumenodex.sh dist/Volumenodex/run.sh
          chmod +x dist/Volumenodex/Volumenodex dist/Volumenodex/run.sh
          tar -czvf "Volumenodex-${TAG}-Linux-x86_64.tar.gz" -C dist Volumenodex

      - name: Upload Linux Asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v2.1.0}"
          gh release upload "$TAG" "Volumenodex-${TAG}-Linux-x86_64.tar.gz" --clobber || true

  build-macos:
    name: Build macOS Universal App & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-docx pyspellchecker pyinstaller Pillow pillow-jxl-plugin

      - name: Build with PyInstaller
        run: |
          pyinstaller Volumenodex.spec

      - name: Package macOS App Bundle into Zip and DMG
        run: |
          TAG="${GITHUB_REF_NAME:-v2.1.0}"
          cd dist
          zip -r -y "../Volumenodex-${TAG}-macOS.zip" Volumenodex.app
          cd ..
          hdiutil create -volname "Volumenodex" -srcfolder "dist/Volumenodex.app" -ov -format UDZO "Volumenodex-${TAG}-macOS.dmg"

      - name: Upload macOS Assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v2.1.0}"
          gh release upload "$TAG" "Volumenodex-${TAG}-macOS.dmg" "Volumenodex-${TAG}-macOS.zip" --clobber || true
